# Inactive proposal for a future local-only Jekyll repository. No publication.
name: Verify standalone snapshot
on: [pull_request, push]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - run: BUNDLE_FROZEN=true python3 nightjar/verify.py
