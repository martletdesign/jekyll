name: Review Martlet section hero crops
on:
  pull_request:
    paths:
      - '.github/workflows/section-crop-gallery.yml'
      - 'scripts/qa/section-crop-gallery.py'
      - '_hero_sources/originals/**'
      - '_hero_sources/provenance/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: section-crops-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  crop-review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Pillow
        run: python -m pip install --disable-pip-version-check Pillow==12.0.0
      - name: Generate genuine crops and contact sheets
        run: python scripts/qa/section-crop-gallery.py --source all --output "$RUNNER_TEMP/martlet-section-crop-gallery"
      - name: Upload gallery and clean candidate WebPs
        uses: actions/upload-artifact@v4
        with:
          name: martlet-section-crop-gallery
          path: ${{ runner.temp }}/martlet-section-crop-gallery/
          if-no-files-found: error
          retention-days: 14
