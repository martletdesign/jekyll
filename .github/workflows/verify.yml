name: Verify standalone Jekyll
on:
  pull_request:
    branches: [develop, main]
permissions:
  contents: read
concurrency:
  group: jekyll-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - run: BUNDLE_FROZEN=true python3 nightjar/verify.py
        env:
          BUNDLE_PATH: ${{ github.workspace }}/vendor/bundle
      - name: Verify hero assets and deployment boundaries without credentials
        run: |
          python3 -m unittest discover -s tests -p 'test_hero.py'
          python3 -m unittest discover -s tests -p 'test_deployment.py'
          python3 -m unittest discover -s tests -p 'test_hero_contract.py'
          python3 -m unittest discover -s tests -p 'test_pr_preview_verification.py'
        env:
          BUNDLE_FROZEN: 'true'
          BUNDLE_PATH: ${{ github.workspace }}/vendor/bundle
