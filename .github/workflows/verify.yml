name: Verify standalone Jekyll
on:
  pull_request:
    branches: [develop]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - run: BUNDLE_FROZEN=true python3 nightjar/verify.py
        env:
          BUNDLE_PATH: ${{ github.workspace }}/vendor/bundle
