name: Standalone browser conformance
on: [pull_request]
permissions:
  contents: read
concurrency:
  group: jekyll-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps ${{ matrix.browser }}
        timeout-minutes: 5
      - run: npm run test:browser
        env:
          BROWSER: ${{ matrix.browser }}
          BUNDLE_FROZEN: 'true'
      - run: node tests/docs-browser.mjs
        env:
          BROWSER: ${{ matrix.browser }}
          BUNDLE_FROZEN: 'true'
          BUNDLE_PATH: ${{ github.workspace }}/vendor/bundle
